services:
  hub:
    image: ${DOCKERHUB_IMAGE:?set DOCKERHUB_IMAGE to the published Lite Hub image}:${A2A888_HUB_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.scope: "888a2a-lite"
    ports:
      - "${A2A888_HUB_PORT:-8080}:8080"
    environment:
      A2A888_HUB_ID: ${A2A888_HUB_ID:-public}
      A2A888_HUB_LISTEN_ADDR: ":8080"
      A2A888_HUB_DB_PATH: /data/hub.db
      A2A888_HUB_PUBLIC_URL: ${A2A888_HUB_PUBLIC_URL:-http://localhost:8080}
      A2A888_HUB_OPERATOR_TOKEN: ${A2A888_HUB_OPERATOR_TOKEN:?set A2A888_HUB_OPERATOR_TOKEN outside this file}
      A2A888_HUB_PEER_LEASE_SECONDS: ${A2A888_HUB_PEER_LEASE_SECONDS:-900}
      A2A888_HUB_REGISTRATION_TTL_SECONDS: ${A2A888_HUB_REGISTRATION_TTL_SECONDS:-31536000}
      A2A888_HUB_MAX_GROUP_MEMBERS: ${A2A888_HUB_MAX_GROUP_MEMBERS:-32}
      A2A888_HUB_MAX_GROUP_FANOUT: ${A2A888_HUB_MAX_GROUP_FANOUT:-32}
      A2A888_HUB_MAX_GROUP_HISTORY_PAGE: ${A2A888_HUB_MAX_GROUP_HISTORY_PAGE:-100}
      A2A888_HUB_SHARED_KEY: ${A2A888_HUB_SHARED_KEY:-}
      A2A888_HUB_CIRCLE_MODE: ${A2A888_HUB_CIRCLE_MODE:-single}
      A2A888_HUB_SHARED_KEYS: ${A2A888_HUB_SHARED_KEYS:-}
      A2A888_HUB_ALLOW_DYNAMIC_CIRCLES: ${A2A888_HUB_ALLOW_DYNAMIC_CIRCLES:-false}
      A2A888_HUB_CIRCLE_DERIVATION_SECRET: ${A2A888_HUB_CIRCLE_DERIVATION_SECRET:-}
      A2A888_HUB_STANDARD_ENABLED: ${A2A888_HUB_STANDARD_ENABLED:-false}
      A2A888_HUB_STANDARD_WAIT_TIMEOUT_SECONDS: ${A2A888_HUB_STANDARD_WAIT_TIMEOUT_SECONDS:-30}
      A2A888_HUB_GROUP_EXTENSION_ENABLED: ${A2A888_HUB_GROUP_EXTENSION_ENABLED:-false}
    volumes:
      - lite-data:/data

volumes:
  lite-data:
