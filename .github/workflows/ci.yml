name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'

jobs:
  python-bridge:
    name: Python bridge checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Compile bridge
        run: python3 -m py_compile examples/worker/a2a_bridge.py examples/worker/test_a2a_bridge.py
      - name: Verify embedded and distributed bridge parity
        run: cmp --silent examples/worker/a2a_bridge.py internal/service/a2a_bridge.py
      - name: Run bridge unit tests
        run: python3 -m unittest discover -s examples/worker -p 'test_*.py'
      - name: Compile pattern examples
        run: python3 -m py_compile examples/patterns/*.py
      - name: Run pattern unit tests
        run: python3 -m unittest discover -s examples/patterns -p 'test_*.py'
      - name: Check inline UI JavaScript syntax
        run: |
          python3 - <<'PY'
          import re, subprocess, tempfile, os
          targets = []
          for p in ("internal/service/chat.html", "internal/service/admin.html"):
              with open(p, "r", encoding="utf-8") as f:
                  scripts = [
                      body for attrs, body in re.findall(r"<script([^>]*)>(.*?)</script>", f.read(), re.S)
                      if "application/ld+json" not in attrs.lower()
                  ]
              for idx, s in enumerate(scripts):
                  targets.append((f"{p}#script{idx}", s.replace("{{CSP_NONCE}}", "nonce").replace("{{LOCAL_UI_TOKEN}}", "tok")))
          with open("examples/worker/a2a_bridge.py", "r", encoding="utf-8") as f:
              py_src = f.read()
          m = re.search(r'CLIENT_HTML = """(.*?)"""', py_src, re.S)
          if m:
              scripts = re.findall(r"<script[^>]*>(.*?)</script>", m.group(1), re.S)
              for idx, s in enumerate(scripts):
                  targets.append((f"CLIENT_HTML#script{idx}", s.replace("{{LOCAL_UI_TOKEN}}", "tok")))
          assert targets, "no inline scripts found"
          for name, code in targets:
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as tf:
                  tf.write(code)
                  tmp = tf.name
              try:
                  subprocess.run(["node", "--check", tmp], check=True)
                  print("JS syntax OK:", name)
              finally:
                  os.unlink(tmp)
          PY

  a2a-compatibility-source:
    name: A2A source and SDK gate
    runs-on: ubuntu-24.04
    env:
      A2A_OFFICIAL_BASE_URL: ${{ secrets.A2A_OFFICIAL_BASE_URL }}
      A2A_OFFICIAL_CARD_URL: ${{ secrets.A2A_OFFICIAL_CARD_URL }}
      A2A_OFFICIAL_TOKEN: ${{ secrets.A2A_OFFICIAL_TOKEN }}
      A2A_GROUP_FIXTURE_URL: ${{ secrets.A2A_GROUP_FIXTURE_URL }}
      A2A_GROUP_FIXTURE_TOKEN: ${{ secrets.A2A_GROUP_FIXTURE_TOKEN }}
      A2A_GROUP_FIXTURE_GROUP_ID: ${{ secrets.A2A_GROUP_FIXTURE_GROUP_ID }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Verify locked protocol sources
        run: bash scripts/verify-a2a-source-manifest.sh
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Install exact official SDK
        run: python3 -m pip install --disable-pip-version-check 'git+https://github.com/a2aproject/a2a-python.git@v1.3.0'
      - name: Verify official REST and tenant support
        run: python3 scripts/verify-a2a-sdk.py
      - name: Compile standard client fixtures
        run: python3 -m py_compile scripts/a2a-standard-client-fixture.py scripts/a2a-official-sdk-fixture.py scripts/a2a-group-extension-fixture.py
      - name: Run official SDK interoperability fixture when configured
        if: ${{ env.A2A_OFFICIAL_BASE_URL != '' && env.A2A_OFFICIAL_CARD_URL != '' && env.A2A_OFFICIAL_TOKEN != '' }}
        run: python3 scripts/a2a-official-sdk-fixture.py
      - name: Run Group Extension fixture when configured
        if: ${{ env.A2A_GROUP_FIXTURE_URL != '' && env.A2A_GROUP_FIXTURE_TOKEN != '' && env.A2A_GROUP_FIXTURE_GROUP_ID != '' }}
        run: python3 scripts/a2a-group-extension-fixture.py

  go:
    name: Go checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run static checks
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  container:
    name: Container build
    runs-on: ubuntu-24.04
    needs: go
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          tags: 888a2a-lite:ci
