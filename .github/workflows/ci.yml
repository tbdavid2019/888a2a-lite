name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.25.6'

jobs:
  python-bridge:
    name: Python bridge checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
      - name: Compile bridge
        run: python3 -m py_compile examples/worker/a2a_bridge.py examples/worker/test_a2a_bridge.py
      - name: Run bridge unit tests
        run: python3 -m unittest discover -s examples/worker -p 'test_*.py'

  a2a-compatibility-source:
    name: A2A source and SDK gate
    runs-on: ubuntu-24.04
    env:
      A2A_OFFICIAL_BASE_URL: ${{ secrets.A2A_OFFICIAL_BASE_URL }}
      A2A_OFFICIAL_CARD_URL: ${{ secrets.A2A_OFFICIAL_CARD_URL }}
      A2A_OFFICIAL_TOKEN: ${{ secrets.A2A_OFFICIAL_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2
      - name: Verify locked protocol sources
        run: bash scripts/verify-a2a-source-manifest.sh
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install exact official SDK
        run: python3 -m pip install --disable-pip-version-check 'a2a-sdk==1.1.4'
      - name: Verify official REST and tenant support
        run: python3 scripts/verify-a2a-sdk.py
      - name: Compile standard client fixtures
        run: python3 -m py_compile scripts/a2a-standard-client-fixture.py scripts/a2a-official-sdk-fixture.py
      - name: Run official SDK interoperability fixture when configured
        if: ${{ env.A2A_OFFICIAL_BASE_URL != '' && env.A2A_OFFICIAL_CARD_URL != '' && env.A2A_OFFICIAL_TOKEN != '' }}
        run: python3 scripts/a2a-official-sdk-fixture.py

  go:
    name: Go checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run static checks
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2

  container:
    name: Container build
    runs-on: ubuntu-24.04
    needs: go
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: false
          tags: 888a2a-lite:ci
