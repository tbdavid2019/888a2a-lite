name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'

jobs:
  verify:
    name: Verify before publish
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run Python bridge tests
        run: python3 -m unittest discover -s examples/worker -p 'test_*.py'

      - name: Run static checks
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0

  publish:
    name: Build and publish image
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/888a2a-lite
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
